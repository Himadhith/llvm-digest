[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llvm-digest"
version = "0.1.0"
description = "DAM agent tooling: watches LLVM Discourse and llvm/llvm-project issues for Sanitizers, LLC backend and Clang frontend items, and prepares executive summaries for Slack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
]

[project.scripts]
llvm-digest = "llvm_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits the real discourse.llvm.org / api.github.com (enable with RUN_LIVE=1)"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
